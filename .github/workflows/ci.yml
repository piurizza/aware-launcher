name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: |
          pip install --quiet actionlint-py
          actionlint -color

  static-analysis:
    name: Format, detekt, Android lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Also validates the Gradle wrapper checksum.
      - uses: gradle/actions/setup-gradle@v4

      - name: Run checks
        run: ./gradlew ktlintCheck detekt lintRelease --continue

      # Code scanning accepts one SARIF run per tool and category, so merge each tool's files.
      - name: Collect SARIF reports
        if: ${{ !cancelled() }}
        run: |
          merge() {
            local out="$1"; shift
            [ "$#" -gt 0 ] || return 0
            mkdir -p "$(dirname "$out")"
            jq -s '.[0] + {runs: [(.[0].runs[0] + {results: [.[].runs[].results[]?]})]}' "$@" > "$out"
          }
          shopt -s nullglob globstar
          merge sarif/detekt/detekt.sarif app/build/reports/detekt/*.sarif
          merge sarif/ktlint/ktlint.sarif app/build/reports/ktlint/**/*.sarif
          merge sarif/android-lint/android-lint.sarif app/build/reports/lint-results-*.sarif
          find sarif -name '*.sarif' 2>/dev/null || true

      # Findings show up inline on pull requests and in the Security tab.
      - name: Upload detekt findings
        if: ${{ !cancelled() && hashFiles('sarif/detekt/*.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sarif/detekt
          category: detekt

      - name: Upload ktlint findings
        if: ${{ !cancelled() && hashFiles('sarif/ktlint/*.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sarif/ktlint
          category: ktlint

      - name: Upload Android Lint findings
        if: ${{ !cancelled() && hashFiles('sarif/android-lint/*.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sarif/android-lint
          category: android-lint

      - name: Upload HTML reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: app/build/reports/
          retention-days: 7

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Upload test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7

  build:
    name: Compile and assemble
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      # Kotlin compiles with allWarningsAsErrors, so this is also the type-check gate.
      # The release build runs R8, so shrinking problems surface here, not at release time.
      - name: Assemble debug and release
        run: ./gradlew assembleDebug assembleRelease

      - name: Report APK size
        run: |
          {
            echo "### APK size"
            echo "| Variant | Size |"
            echo "|---|---|"
            for apk in app/build/outputs/apk/*/*.apk; do
              echo "| $(basename "$apk") | $(du -h "$apk" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aware-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
