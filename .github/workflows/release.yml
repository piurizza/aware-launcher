name: Release

# Push a tag like v1.2.3 to publish a signed APK as a GitHub release.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      security-events: write

  release:
    name: Build and publish
    needs: ci
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Compute version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "$version"
          if (( minor > 999 || patch > 999 )); then
            echo "::error::Minor and patch must be at most 999 (got $version)"
            exit 1
          fi
          # 1.2.3 -> 1002003: always increasing, so updates install over older versions.
          code=$(( major * 1000000 + minor * 1000 + patch ))
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.AWARE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The AWARE_KEYSTORE_BASE64 secret is missing. See README > Releases."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "AWARE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          AWARE_KEYSTORE_PASSWORD: ${{ secrets.AWARE_KEYSTORE_PASSWORD }}
          AWARE_KEY_ALIAS: ${{ secrets.AWARE_KEY_ALIAS }}
          AWARE_KEY_PASSWORD: ${{ secrets.AWARE_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: ./gradlew assembleRelease -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"

      - name: Verify signature
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          "$apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Prepare release assets
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/aware-$VERSION_NAME.apk"
          (cd dist && sha256sum ./*.apk > SHA256SUMS)
          cat dist/SHA256SUMS

      # Lets anyone verify the APK was built by this workflow: gh attestation verify <apk> -R <owner>/<repo>
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --generate-notes \
            --title "Aware $VERSION_NAME"

      - name: Remove signing key
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/release.jks"
